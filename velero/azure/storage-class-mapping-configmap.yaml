apiVersion: v1
kind: ConfigMap
metadata:
  name: change-storage-class-config
  namespace: velero
  labels:
    velero.io/plugin-config: ""
    velero.io/change-storage-class: RestoreItemAction
data:
  # Map AWS EBS StorageClass 'gp2' or 'gp3' to Azure Managed Disk 'managed-csi' or 'default'
  gp2: default
  gp3: managed-csi
