apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: guestbook-multicloud-appset
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - cluster: aws-primary
            url: https://kubernetes.default.svc
            path: workloads/guestbook/overlays/aws
            autoSync: true
          - cluster: azure-standby
            url: https://azure-aks-controlplane.hcp.eastus2.azmk8s.io:443
            path: workloads/guestbook/overlays/azure
            autoSync: false
  template:
    metadata:
      name: "guestbook-{{cluster}}"
    spec:
      project: default
      source:
        repoURL: https://github.com/USERNAME/multi-cloud-k8s-dr.git
        targetRevision: main
        path: "{{path}}"
      destination:
        server: "{{url}}"
        namespace: guestbook
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
