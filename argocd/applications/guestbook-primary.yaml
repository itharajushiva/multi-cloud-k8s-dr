apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: guestbook-aws-primary
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/USERNAME/multi-cloud-k8s-dr.git
    targetRevision: main
    path: workloads/guestbook/overlays/aws
  destination:
    server: https://kubernetes.default.svc
    namespace: guestbook
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
