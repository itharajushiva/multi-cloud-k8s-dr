name: Validate Terraform & Kubernetes Manifests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  terraform-validate:
    name: Terraform Format and Validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir:
          - terraform/environments/aws-primary
          - terraform/environments/azure-standby
          - terraform/modules/aws/networking
          - terraform/modules/aws/eks
          - terraform/modules/aws/storage
          - terraform/modules/azure/networking
          - terraform/modules/azure/aks
          - terraform/modules/azure/storage
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Terraform Format Check
        run: terraform fmt -check ${{ matrix.dir }}

      - name: Terraform Init
        run: terraform -chdir=${{ matrix.dir }} init -backend=false

      - name: Terraform Validate
        run: terraform -chdir=${{ matrix.dir }} validate

  k8s-manifest-lint:
    name: Kustomize & Shell Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.3.0"

      - name: Build Kustomize AWS Overlay
        run: kustomize build workloads/guestbook/overlays/aws > /dev/null

      - name: Build Kustomize Azure Overlay
        run: kustomize build workloads/guestbook/overlays/azure > /dev/null

      - name: ShellCheck DR Scripts
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './scripts'
